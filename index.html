<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABD Toolkit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0a0e14;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0e14;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .loader-container {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            position: absolute;
            z-index: 2;
            border: 3px solid #0a0e14;
        }
        .spinner {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #00b0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 1;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #verification {
            display: none;
            text-align: center;
            position: absolute;
            z-index: 50;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background-color: #00b0ff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        #content {
            display: none;
            flex-direction: column;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 10px;
        }
        .section {
            background-color: #161f28;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 5px;
        }
        .help-dropdown {
            position: absolute;
            top: 20px;
            left: 20px;
            cursor: pointer;
            z-index: 200;
        }
        .help-content {
            display: none;
            background-color: #161f28;
            padding: 10px;
            border-radius: 5px;
            position: absolute;
            top: 30px;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="help-dropdown" onclick="let h = document.querySelector('.help-content'); h.style.display = h.style.display === 'block' ? 'none' : 'block'">
        Help ▾
        <div class="help-content">
            <a href="https://wa.me/yourwhatsapplink" style="color:#00b0ff; text-decoration:none;">Contact on WhatsApp</a>
        </div>
    </div>
    
    <div id="loader">
        <div class="loader-container">
            <img src="https://i.ibb.co/305886X/boy-artwork.jpg" alt="Logo" class="logo-img">
            <div class="spinner"></div>
        </div>
    </div>

    <div id="verification">
        <h2>Verify to Continue</h2>
        <p>Follow TikTok and Join WhatsApp</p>
        <a href="https://tiktok.com/@yourtiktok" target="_blank" class="btn" onclick="checkVerification()">Follow TikTok</a>
        <a href="https://chat.whatsapp.com/yourgroup" target="_blank" class="btn" onclick="checkVerification()">Join WhatsApp Group</a>
        <br>
        <button id="access-btn" class="btn" style="display:none;" onclick="showContent()">Access Website</button>
    </div>

    <div id="content">
        <div class="section">
            <h2>Applications</h2>
            <a href="https://www.mediafire.com/file/4on3xzbykjcwyco/razatoolkit_CapCut.apk/file" target="_blank" style="color: #00b0ff; font-size: 18px; text-decoration: none;">Download CapCut APK (MediaFire)</a>
        </div>
        <div class="section">
            <h2>Courses</h2>
            <iframe width="100%" height="315" src="https://www.youtube.com/embed/ONGScQp93Go" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="section">
            <h2>Social Groups</h2>
            <p>Join our exclusive community groups.</p>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                let loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    document.getElementById('verification').style.display = 'block';
                }, 500);
            }, 3000);
        });
        
        let verifiedCount = 0;
        function checkVerification() {
            verifiedCount++;
            if (verifiedCount >= 2) {
                document.getElementById('access-btn').style.display = 'inline-block';
            }
        }
        
        function showContent() {
            document.getElementById('verification').style.display = 'none';
            document.getElementById('content').style.display = 'flex';
        }
    </script>
</body>
</html>
